<svg width="200" height="300" xmlns="http://www.w3.org/2000/svg">
    <!-- Define the gradient with the specified colors -->
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#f6d746;stop-opacity:1" />
            <stop offset="33%" style="stop-color:#e55c30;stop-opacity:1" />
            <stop offset="66%" style="stop-color:#84206b;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#140b34;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- First pill shape with a 1px border, centered -->
    <path d="M 25,50 a 20,20 0 0 1 40,0 v 160 a 20,20 0 0 1 -40,0 v -160" fill="url(#grad1)" stroke="#595959"
        stroke-width="1" />

    <!-- Second pill shape with a 1px border, staggered lower, centered -->
    <path d="M 80,80 a 20,20 0 0 1 40,0 v 160 a 20,20 0 0 1 -40,0 v -160" fill="url(#grad1)" stroke="#595959"
        stroke-width="1" />

    <!-- Third pill shape with a 1px border, staggered even lower, centered -->
    <path d="M 135,110 a 20,20 0 0 1 40,0 v 160 a 20,20 0 0 1 -40,0 v -160" fill="url(#grad1)" stroke="#595959"
        stroke-width="1" />
</svg>